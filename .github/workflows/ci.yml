name: ScopeGuard CI

on:
  push:
    branches: [ main, fix/final-polish ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SCOPEGUARD_POLICY_CONTRACT: guard2.sergeo-guard.testnet
  NEXT_PUBLIC_POLICY_CONTRACT_ID: guard2.sergeo-guard.testnet

jobs:
  contracts:
    name: Rust Contracts Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown

      - name: Run policy contract unit tests
        run: cargo test --manifest-path contracts/Cargo.toml

      - name: Verify WebAssembly build target
        run: cargo check --target wasm32-unknown-unknown --manifest-path contracts/Cargo.toml

  packages-and-web:
    name: TypeScript Packages and Web Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run project setup
        run: node scripts/setup.js

      - name: Run all TypeScript test suites
        run: |
          npm test --prefix sdk
          npm test --prefix watcher
          npm test --prefix packages/ironclaw-mcp
          npm test --prefix packages/plugin-eliza
          npm test --prefix web
          npm run typecheck --prefix web

      - name: Build Web application with NO env vars
        run: npm run build --prefix web
        env:
          SCOPEGUARD_POLICY_CONTRACT: ""
          NEXT_PUBLIC_POLICY_CONTRACT_ID: ""
          NEXT_PUBLIC_OWNER_ACCOUNT_ID: ""
          NEXT_PUBLIC_TOKEN_CONTRACT: ""
          NEXT_PUBLIC_DEX_CONTRACT: ""
          NEXT_PUBLIC_NEAR_NETWORK: ""
          NEXT_PUBLIC_NEAR_RPC: ""

      - name: Build Web application
        run: npm run build --prefix web
        env:
          NEXT_PUBLIC_POLICY_CONTRACT_ID: guard2.sergeo-guard.testnet
          NEXT_PUBLIC_OWNER_ACCOUNT_ID: sergeo-guard.testnet
          NEXT_PUBLIC_TOKEN_CONTRACT: sergeo-guard-token.testnet
          NEXT_PUBLIC_DEX_CONTRACT: sergeo-guard-dex.testnet
          NEXT_PUBLIC_NEAR_NETWORK: testnet
          NEXT_PUBLIC_NEAR_RPC: https://test.rpc.fastnear.com
